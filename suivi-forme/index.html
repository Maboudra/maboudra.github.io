<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forme">
<meta name="theme-color" content="#0f1115">
<title>Suivi Forme</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--text:#eef0f4;--muted:#8b93a3;--accent:#4ade80;--accent2:#60a5fa;--warn:#fbbf24;--bad:#f87171;--line:#2a2f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
textarea,input,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:84px;resize:vertical}
button{background:var(--accent);color:#06210f;border:0;border-radius:10px;padding:11px 14px;font:600 15px inherit;font-family:inherit;cursor:pointer}
button.ghost{background:var(--card2);color:var(--text)}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.x{background:none;color:var(--muted);padding:0 4px;font-size:18px}
.tag{display:inline-block;background:var(--card2);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);margin-right:4px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--muted);padding:8px}
.seg button.on{background:var(--card);color:var(--text)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0}
.sets{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;margin-top:8px}
.sets input{padding:7px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
nav{position:fixed;bottom:0;left:0;right:0;background:#12151bee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 0 12px;font-size:11px;font-weight:500}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent)}
.ai{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:12px;margin-top:10px}
.warn{color:var(--warn)}
.bad{color:var(--bad)}
svg text{fill:var(--muted);font-size:10px}
details summary{cursor:pointer;color:var(--accent2);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
// ---------- Données de base ----------
const ex = (n, t, alt) => ({n, t, alt});
const PROGRAM = {
  A: {name: 'Haut du corps, priorité tirage', def: 'maison',
    maison: [ex('Tractions négatives', '4 x 3 (descente 5 s)', ['Suspension active 20 s', 'Tractions élastique', 'Tractions strictes (quand max ≥ 5)']),
      ex('Rowing australien (barre basse)', '4 x 8-12', ['Rowing sous une table', 'Rowing pieds surélevés (plus dur)']),
      ex('Chin-up isométrique', '3 x 10-20 s', ['Suspension bras fléchis à 90°']),
      ex('Pompes', '3 x 8-15', ['Pompes pieds surélevés', 'Pompes archer']),
      ex('Y-T-W au sol', '3 x 10', ['Superman', 'Planche inversée']),
      ex('Curl sac à dos', '3 x 12', ['Curl serviette', 'Chin-up négatif prise serrée'])],
    salle: [ex('Tractions assistées machine', '4 x 6-10', ['Tractions négatives', 'Tirage vertical poulie']),
      ex('Rowing barre', '3 x 8-10', ['Rowing haltère un bras', 'Rowing poulie assis']),
      ex('Face pull', '3 x 12-15', ['Oiseau haltères', 'Reverse fly machine']),
      ex('Développé haltères', '3 x 8-12', ['Pompes lestées']),
      ex('Curl haltères', '3 x 10-12', ['Curl barre EZ', 'Curl marteau'])]},
  B: {name: 'Haut du corps, priorité poussée', def: 'maison',
    maison: [ex('Dips', '4 x 6-12', ['Dips négatifs', 'Dips lestés sac à dos (quand 4 x 12 OK)']),
      ex('Pompes', '4 x 8-15', ['Pompes pieds surélevés', 'Pompes archer', 'Pompes lestées sac à dos']),
      ex('Pike push-ups', '3 x 6-10', ['Pompes déclinées', 'Poirier contre le mur (avancé)']),
      ex('Rowing australien (barre basse)', '3 x 10', ['Rowing sous une table']),
      ex('Pompes diamant', '3 x max -2', ['Pompes serrées', 'Dips sur banc']),
      ex('Relevés de genoux à la barre', '3 x 8-12', ['Hollow hold', 'Planche 45 s'])],
    salle: [ex('Développé couché', '4 x 6-10', ['Développé haltères', 'Presse pectorale machine']),
      ex('Dips', '3 x 8-12', ['Dips lestés', 'Dips machine']),
      ex('Développé militaire haltères', '3 x 8-10', ['Développé épaules machine', 'Arnold press']),
      ex('Élévations latérales', '3 x 12-15', ['Élévations poulie']),
      ex('Extension triceps poulie', '3 x 10-12', ['Barre au front'])]},
  C: {name: 'Jambes + cardio Zone 2', def: 'salle',
    salle: [ex('Presse à cuisses', '4 x 10-12', ['Hack squat', 'Goblet squat (si cheville OK)']),
      ex('Hip thrust', '3 x 10-12', ['Pont fessier barre', 'Kickback poulie']),
      ex('Leg curl', '3 x 10-12', ['Soulevé de terre roumain haltères', 'Nordic négatif']),
      ex('Leg extension', '3 x 12-15', ['Presse pieds bas']),
      ex('Mollets debout (rééducation)', '3 x 15', ['Mollets assis machine', 'Mollets à la presse']),
      ex('Relevés de jambes suspendu', '3 x 8-12', ['Relevés de genoux', 'Crunch poulie']),
      ex('Vélo ou rameur Zone 2', '20-30 min (tu peux parler)', ['Tapis en pente, marche', 'Elliptique (si cheville OK)'])],
    maison: [ex('Chaise murale', '3 x 30-60 s', ['Squat partiel sans douleur', 'Squat sur chaise']),
      ex('Pont fessier une jambe', '3 x 10-15', ['Pont fessier deux jambes', 'Hip thrust sur canapé']),
      ex('Leg curl serviette au sol', '3 x 8-12', ['Pont fessier marché']),
      ex('Fente arrière lente (si zéro douleur)', '3 x 8 / jambe', ['Split squat statique', 'Step-up sur marche basse']),
      ex('Montées sur pointe', '3 x 15', ['Montées sur pointe assis', 'Deux pieds si douleur']),
      ex('Marche rapide Zone 2', '30-40 min', ['Vélo d\'appartement'])]},
  D: {name: 'Full body + HIIT sans saut', def: 'maison',
    maison: [ex('Tractions négatives', '3 x 3', ['Suspension active 20 s']),
      ex('Circuit : pompes', '4 tours x 10', ['Pompes surélevées']),
      ex('Circuit : rowing australien', '4 tours x 10', ['Rowing sous une table']),
      ex('Circuit : dips', '4 tours x 8', ['Dips sur banc']),
      ex('Circuit : pont fessier', '4 tours x 15', ['Chaise murale 40 s']),
      ex('HIIT sans saut', '8 x (30 s effort / 30 s repos)', ['Mountain climbers lents', 'Squat + planche alternés', 'Shadow boxing'])],
    salle: [ex('Tractions assistées machine', '3 x 6-10', ['Tractions négatives']),
      ex('Développé incliné haltères', '3 x 8-12', ['Pompes pieds surélevés']),
      ex('Rowing poulie assis', '3 x 10-12', ['Rowing haltère']),
      ex('Presse à cuisses', '3 x 12', ['Hack squat']),
      ex('HIIT vélo ou rameur', '8 x (30 s fort / 90 s léger)', ['Assault bike', 'Ergomètre à bras'])]}
};
const WEEK = [['Lun', 'A · Haut tirage (maison)'], ['Mar', 'Zone 2, 40 min'], ['Mer', 'B · Haut poussée (maison)'],
  ['Jeu', 'C · Jambes + Zone 2 (salle)'], ['Ven', 'Repos actif, marche'], ['Sam', 'D · Full body + HIIT doux (maison)'], ['Dim', 'Repos ou Zone 2']];
const ORDER = ['A', 'B', 'C', 'D'];

const REHAB = {
  1: {name: 'Phase 1 : douleur / gonflement', items: [
    'Alphabet avec le pied, 2 fois', 'Isométriques 4 directions contre un mur, 5 x 10 s', 'Flexion / extension sans douleur, 2 x 20',
    'Marche normale tant que ça ne fait pas mal', 'Glace 15 min si gonflé']},
  2: {name: 'Phase 2 : renforcement', items: [
    'Élastique 4 directions, 3 x 15 chacune (surtout vers l\'extérieur)', 'Équilibre sur la jambe blessée, 3 x 30 s',
    'Montées sur pointe deux pieds, 3 x 15', 'Marche sur talons puis sur pointes, 2 x 20 m']},
  3: {name: 'Phase 3 : proprioception et retour', items: [
    'Équilibre une jambe yeux fermés, 3 x 30 s', 'Équilibre une jambe sur coussin, 3 x 30 s',
    'Montées sur pointe une jambe, 3 x 15', 'Petits sauts sur place deux pieds, 3 x 20 (si zéro douleur)', 'Sauts latéraux légers, 3 x 10']}
};
const CRITERIA = ['Marche 30 min sans douleur', 'Équilibre une jambe 30 s stable (côté blessé)',
  '15 montées sur pointe une jambe sans douleur', '20 petits sauts sur place une jambe sans douleur'];
const RUNPLAN = [
  'S1 : marche rapide 30 min, 2 fois', 'S2 : 6 x (2 min trot / 2 min marche), 2 fois', 'S3 : 6 x (3 min trot / 1 min marche), 2 fois',
  'S4 : 20 min continu, 2 fois', 'S5 : 25 min + 20 min', 'S6 : 30 min (≈ 5 km) + 25 min', 'S7 : semaine allégée, 2 x 25 min',
  'S8 et après : sortie longue +10 % par semaine, l\'autre sortie stable à 30 min. Une semaine allégée toutes les 3-4 semaines. 10 km ≈ 12-14 semaines après la reprise.'];

// ---------- État ----------
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmt = s => new Date(s + 'T12:00').toLocaleDateString('fr-BE', {weekday: 'short', day: 'numeric', month: 'short'});
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

const DEFAULT = {
  settings: {apiKey: '', model: 'gpt-4o-mini', kcal: 2100, prot: 160, startWeight: 0, goalWeight: 0, goalDate: '', profil: ''},
  meals: {}, weights: [], workouts: [], runs: [], ankle: {phase: 1, log: {}, criteria: {}},
  gtg: {log: {}, tests: []}, cardio: [], measures: []
};
let S;
try { S = Object.assign(structuredClone(DEFAULT), JSON.parse(localStorage.getItem('suivi-forme') || '{}')); } catch { S = structuredClone(DEFAULT); }
const save = () => { try { localStorage.setItem('suivi-forme', JSON.stringify(S)); } catch (e) { alert('Sauvegarde impossible : ' + e.message); } };
if (navigator.storage?.persist) navigator.storage.persist();

let tab = 'repas', mealDate = today(), busy = false, aiOut = '', mealTxt = '', sessionKey = null, mode = 'salle', draft = null;

// ---------- IA (OpenAI) ----------
async function ask(system, user, json) {
  if (!S.settings.apiKey) throw new Error('Ajoute ta clé OpenAI dans Réglages.');
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + S.settings.apiKey},
    body: JSON.stringify({model: S.settings.model, messages: [{role: 'system', content: system}, {role: 'user', content: user}],
      ...(json ? {response_format: {type: 'json_object'}} : {})})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || 'Erreur API ' + r.status);
  return d.choices[0].message.content;
}

const MEAL_PROMPT = `Tu es nutritionniste. L'utilisateur décrit ce qu'il a mangé, en français, parfois de façon approximative (dictée vocale).
Estime chaque aliment avec des valeurs réalistes (tables type CIQUAL/USDA). Réponds UNIQUEMENT en JSON :
{"items":[{"repas":"Matin|Midi|Soir|Collation","aliment":"...","quantite":"...","kcal":0,"proteines":0,"glucides":0,"lipides":0}],"hypotheses":"...","question":null}
Règles : un item par aliment. Si le repas n'est pas précisé, devine selon le contexte ou mets "Collation".
Riz, pâtes, semoule sans précision : suppose le poids CUIT et dis-le dans "hypotheses". Quantités vagues ("un peu de fromage") : prends une portion standard et note-la.
Oeufs : environ 50 g sans coquille. Huile de cuisson non mentionnée : ajoute 1 c. à soupe par plat cuisiné et dis-le.
"question" : une seule question courte si une info change beaucoup le total, sinon null. Valeurs en nombres entiers.`;

function context() {
  const days = [...Array(7)].map((_, i) => addDays(today(), -i));
  return JSON.stringify({
    profil: S.settings.profil || 'Non renseigné',
    semaine_type: WEEK, tractions_gtg: {tests_max: S.gtg.tests.slice(-6), jours: Object.entries(S.gtg.log).slice(-10).map(([d, l]) => ({d, total: l.reduce((a, b) => a + b, 0)}))},
    cardio: S.cardio.slice(-10), mensurations: S.measures.slice(-4),
    objectifs: S.settings, poids_recents: S.weights.slice(-14),
    calories_7j: days.map(d => ({d, kcal: dayTotals(d).kcal, prot: dayTotals(d).p})),
    seances_recentes: S.workouts.slice(-6), courses: S.runs.slice(-6),
    cheville: {phase: S.ankle.phase, criteres_valides: CRITERIA.filter((_, i) => S.ankle.criteria[i])},
    programme: Object.fromEntries(ORDER.map(k => [k, PROGRAM[k].name]))
  });
}
const COACH_PROMPT = `Tu es le coach sportif et nutrition personnel de l'utilisateur. Réponds en français, direct, concis, concret. N'utilise jamais de tirets longs.
Tu connais son contexte (JSON fourni). Sois prudent avec la cheville : pas de course ni de sauts tant que les critères de reprise ne sont pas validés.
Tu peux proposer des séances, des alternatives d'exercices, ajuster le programme, analyser sa progression et ses calories. Tu n'es pas médecin : renvoie vers un professionnel en cas de douleur forte, gonflement important ou rechute.`;

// ---------- Calculs ----------
function dayTotals(d) {
  const t = {kcal: 0, p: 0, g: 0, l: 0};
  (S.meals[d] || []).forEach(i => { t.kcal += +i.kcal || 0; t.p += +i.proteines || 0; t.g += +i.glucides || 0; t.l += +i.lipides || 0; });
  return t;
}
function weightStats() {
  const w = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const avg = w.map((x, i) => {
    const win = w.filter(y => y.date <= x.date && y.date > addDays(x.date, -7));
    return {date: x.date, kg: x.kg, avg: win.reduce((s, y) => s + y.kg, 0) / win.length};
  });
  let rate = null, eta = null;
  if (avg.length >= 2) {
    const last = avg[avg.length - 1], ref = avg.find(a => a.date >= addDays(last.date, -14)) || avg[0];
    const days = (new Date(last.date) - new Date(ref.date)) / 864e5;
    if (days >= 5) {
      rate = (last.avg - ref.avg) / days * 7;
      if (rate < 0) eta = addDays(last.date, Math.round((last.avg - S.settings.goalWeight) / -rate * 7));
    }
  }
  const cur = avg.length ? avg[avg.length - 1].avg : S.settings.startWeight;
  const weeksLeft = Math.max(0.1, (new Date(S.settings.goalDate) - new Date(today())) / 6048e5);
  return {avg, rate, eta, cur, needed: (S.settings.goalWeight - cur) / weeksLeft};
}
function lastPerf(name) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const e = S.workouts[i].exercises.find(x => x.name === name && x.sets.some(s => s.reps));
    if (e) return fmt(S.workouts[i].date) + ' : ' + e.sets.filter(s => s.reps).map(s => s.reps + (s.kg ? '×' + s.kg + 'kg' : '')).join(', ');
  }
  return null;
}
const nextSession = () => { const l = S.workouts[S.workouts.length - 1]; return l ? ORDER[(ORDER.indexOf(l.session) + 1) % 4] : 'A'; };
const pullMax = () => S.gtg.tests[S.gtg.tests.length - 1]?.max || 1;
const gtgReps = () => Math.max(1, Math.floor(pullMax() / 2));
const weekStart = () => { const d = new Date(today() + 'T12:00'); return addDays(today(), -((d.getDay() + 6) % 7)); };

function viewGtg() {
  const l = S.gtg.log[today()] || [], tot = l.reduce((a, b) => a + b, 0), n = gtgReps();
  const tests = S.gtg.tests.slice(-6);
  return `<div class="card"><h2>Tractions du jour (grease the groove)</h2>
    <div class="grid4" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><b>${tot}</b><span>reps aujourd'hui</span></div>
      <div class="stat"><b>${l.length}</b><span>séries</span></div>
      <div class="stat"><b>${pullMax()}</b><span>max actuel</span></div></div>
    <div class="row" style="margin-top:10px"><button data-a="gtgAdd" data-v="${n}">+ ${n} traction${n > 1 ? 's' : ''}</button>
      <button class="ghost" style="flex:none" data-a="gtgUndo" ${l.length ? '' : 'disabled'}>Annuler</button></div>
    <p class="muted">Séries de ${n} (moitié de ton max), 5 à 8 fois dans la journée, après les prières par exemple. Jamais à l'échec, toujours propre. Pause le jour de la séance A si tu es fatigué.</p>
    <div class="row"><input id="maxIn" inputmode="numeric" placeholder="Nouveau max (test 1x/semaine, frais)"><button class="ghost" style="flex:none" data-a="gtgMax">Tester</button></div>
    ${tests.length > 1 ? `<p class="muted" style="margin-bottom:0">Progression : ${tests.map(t => t.max).join(' → ')}</p>` : ''}</div>`;
}

function viewCardio() {
  const ws = weekStart(), week = S.cardio.filter(c => c.date >= ws);
  const z2 = week.filter(c => c.type === 'Zone 2').reduce((a, c) => a + c.min, 0), hiit = week.filter(c => c.type === 'HIIT').length;
  return `<div class="card"><h2>Cardio</h2>
    <div class="row"><select id="cType"><option>Zone 2</option><option>HIIT</option><option>Marche</option></select>
      <input id="cMin" inputmode="numeric" placeholder="min"><button style="flex:none" data-a="addCardio">+</button></div>
    <p class="muted" style="margin-bottom:0">Cette semaine : ${z2} min de Zone 2 (cible 80-120) · ${hiit} HIIT (max 1)${hiit > 1 ? ' <span class="warn">⚠️ trop en déficit</span>' : ''}</p></div>`;
}

// ---------- Vues ----------
function viewRepas() {
  const items = S.meals[mealDate] || [], t = dayTotals(mealDate), st = S.settings;
  const pct = Math.min(100, t.kcal / st.kcal * 100), over = t.kcal > st.kcal;
  const groups = ['Matin', 'Midi', 'Soir', 'Collation'].map(r => [r, items.filter(i => (i.repas || 'Collation') === r)]).filter(g => g[1].length);
  return `<h1>Repas</h1>
  <div class="card">
    <div class="row" style="margin-bottom:10px"><button class="ghost small" style="flex:none" data-a="day" data-v="-1">‹</button>
      <div style="text-align:center"><b>${mealDate === today() ? "Aujourd'hui" : fmt(mealDate)}</b></div>
      <button class="ghost small" style="flex:none" data-a="day" data-v="1">›</button></div>
    <div class="grid4">
      <div class="stat"><b class="${over ? 'bad' : ''}">${t.kcal}</b><span>/ ${st.kcal} kcal</span></div>
      <div class="stat"><b>${t.p}</b><span>/ ${st.prot} g prot.</span></div>
      <div class="stat"><b>${t.g}</b><span>g gluc.</span></div>
      <div class="stat"><b>${t.l}</b><span>g lip.</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%;background:${over ? 'var(--bad)' : 'var(--accent)'}"></i></div>
    <div class="muted" style="margin-top:6px">${over ? 'Dépassé de ' + (t.kcal - st.kcal) : 'Reste ' + (st.kcal - t.kcal)} kcal · protéines restantes : ${Math.max(0, st.prot - t.p)} g</div>
  </div>
  <div class="card">
    <h2>Qu'as-tu mangé ?</h2>
    <textarea id="mealText" placeholder="Ex : ce matin 5 oeufs avec un peu de fromage, à midi 300 g de poulet, 200 g de riz cuit et des légumes">${esc(mealTxt)}</textarea>
    <p class="muted">Astuce : utilise le micro du clavier. Précise cru ou cuit pour le riz et les pâtes.</p>
    <button data-a="meal" ${busy ? 'disabled' : ''} style="width:100%">${busy ? 'Calcul…' : 'Calculer et ajouter'}</button>
    ${aiOut ? `<div class="ai">${esc(aiOut)}</div>` : ''}
  </div>
  ${groups.map(([r, list]) => `<div class="card"><h2>${r} <span class="muted">${list.reduce((s, i) => s + (+i.kcal || 0), 0)} kcal</span></h2>
    ${list.map(i => `<div class="item"><div><div>${esc(i.aliment)} <span class="muted">${esc(i.quantite)}</span></div>
      <div class="muted">P ${i.proteines} · G ${i.glucides} · L ${i.lipides}</div></div>
      <div class="row" style="flex:none"><b>${i.kcal}</b><button class="x" data-a="delItem" data-v="${i.id}">×</button></div></div>`).join('')}</div>`).join('')}`;
}

function viewSeance() {
  const k = sessionKey || nextSession(), P = PROGRAM[k];
  if (!draft || draft.session !== k || draft.mode !== mode)
    draft = {session: k, mode, exercises: P[mode].map(e => ({name: e.n, base: e.n, sets: [{}, {}, {}, {}].slice(0, Math.max(3, parseInt(e.t) || 3))}))};
  const hist = S.workouts.slice(-5).reverse();
  const dow = (new Date(today() + 'T12:00').getDay() + 6) % 7;
  return `<h1>Séance</h1>
  ${viewGtg()}
  <div class="card"><details><summary>Semaine type · aujourd'hui : ${WEEK[dow][1]}</summary>
    ${WEEK.map(([d, t], i) => `<div class="item"><span class="${i === dow ? '' : 'muted'}">${d}</span><span class="${i === dow ? '' : 'muted'}">${t}</span></div>`).join('')}</details></div>
  ${viewCardio()}
  <div class="card">
    <div class="seg" style="margin-bottom:8px">${ORDER.map(x => `<button class="${x === k ? 'on' : ''}" data-a="sess" data-v="${x}">${x}${x === nextSession() ? ' •' : ''}</button>`).join('')}</div>
    <div class="seg">${['salle', 'maison'].map(m => `<button class="${m === mode ? 'on' : ''}" data-a="mode" data-v="${m}">${m === 'salle' ? 'Salle' : 'Maison'}</button>`).join('')}</div>
    <h2 style="margin-top:12px">${k} · ${P.name}</h2>
    <p class="muted">Progression : quand tu atteins le haut de la fourchette sur toutes les séries, ajoute du poids ou passe à une variante plus dure. Garde 1-2 reps en réserve.</p>
    ${draft.exercises.map((e, i) => { const def = P[mode][i], lp = lastPerf(e.name); return `<div class="ex">
      <select data-a="swap" data-v="${i}">${[def.n, ...def.alt].map(n => `<option ${n === e.name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <div class="muted" style="margin-top:4px">Objectif : ${def.t}${lp ? '<br>Dernière fois : ' + esc(lp) : ''}</div>
      <div class="sets"><span class="muted">#</span><span class="muted">Reps / sec</span><span class="muted">Kg ${mode === 'maison' ? '(lest)' : ''}</span>
      ${e.sets.map((s, j) => `<span class="muted">${j + 1}</span><input inputmode="numeric" data-a="set" data-v="${i},${j},reps" value="${s.reps ?? ''}"><input inputmode="decimal" data-a="set" data-v="${i},${j},kg" value="${s.kg ?? ''}">`).join('')}</div>
    </div>`; }).join('')}
    <input id="wNote" placeholder="Note (cheville, énergie, sommeil…)" style="margin:8px 0">
    <button data-a="saveW" style="width:100%">Enregistrer la séance</button>
  </div>
  <div class="card"><h2>Coach IA</h2>
    <textarea id="coachQ" placeholder="Ex : je n'ai que 25 min ce matin, adapte la séance B. Ou : analyse ma semaine."></textarea>
    <button data-a="coach" ${busy ? 'disabled' : ''} style="width:100%;margin-top:8px">${busy ? 'Réflexion…' : 'Demander'}</button>
    ${aiOut ? `<div class="ai">${esc(aiOut)}</div>` : ''}
  </div>
  ${hist.length ? `<div class="card"><h2>Historique</h2>${hist.map(w => `<div class="item"><div>${fmt(w.date)} · ${w.session} <span class="tag">${w.mode}</span>
    <div class="muted">${w.exercises.filter(e => e.sets.some(s => s.reps)).length} exercices${w.note ? ' · ' + esc(w.note) : ''}</div></div>
    <button class="x" data-a="delW" data-v="${w.id}">×</button></div>`).join('')}</div>` : ''}`;
}

function chart(avg) {
  if (avg.length < 2) return '<p class="muted">La courbe apparaît après 2 pesées.</p>';
  const W = 340, H = 170, pad = 26, g = S.settings.goalWeight;
  const xs = avg.map(a => new Date(a.date).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = avg.flatMap(a => [a.kg, a.avg]).concat(g), y0 = Math.min(...ys) - 0.5, y1 = Math.max(...ys) + 0.5;
  const X = t => pad + (t - x0) / Math.max(1, x1 - x0) * (W - pad - 8), Y = v => 8 + (y1 - v) / (y1 - y0) * (H - 30);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${pad}" x2="${W - 8}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${W - 8}" y="${Y(g) - 4}" text-anchor="end">objectif ${g}</text>
    <text x="2" y="${Y(y1 - 0.5) + 4}">${(y1 - 0.5).toFixed(1)}</text><text x="2" y="${Y(y0 + 0.5) + 4}">${(y0 + 0.5).toFixed(1)}</text>
    ${avg.map((a, i) => `<circle cx="${X(xs[i])}" cy="${Y(a.kg)}" r="2.5" fill="var(--muted)"/>`).join('')}
    <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" points="${avg.map((a, i) => X(xs[i]) + ',' + Y(a.avg)).join(' ')}"/>
    <text x="${pad}" y="${H - 4}">${fmt(avg[0].date)}</text><text x="${W - 8}" y="${H - 4}" text-anchor="end">${fmt(avg[avg.length - 1].date)}</text>
  </svg><p class="muted">Points : pesées. Ligne bleue : moyenne sur 7 jours (la seule à regarder).</p>`;
}

function viewPoids() {
  if (!S.settings.startWeight || !S.settings.goalWeight || !S.settings.goalDate) return `<h1>Poids</h1><div class="card"><p>Renseigne ton poids de départ, ton poids objectif et ta date objectif dans ⚙️ Réglages.</p><button data-a="tab" data-v="reglages">Aller aux réglages</button></div>`;
  const s = weightStats(), st = S.settings, lost = st.startWeight - s.cur;
  const onTrack = s.rate !== null && s.eta && s.rate <= s.needed;
  return `<h1>Poids</h1>
  <div class="card"><div class="row"><input id="wKg" inputmode="decimal" placeholder="Poids ce matin (kg)"><button data-a="addKg" style="flex:none">Ajouter</button></div>
    <p class="muted">Pèse-toi le matin, à jeun, après les toilettes. Idéalement tous les jours.</p></div>
  <div class="card"><div class="grid4">
    <div class="stat"><b>${s.cur.toFixed(1)}</b><span>moy. 7 j</span></div>
    <div class="stat"><b>${lost >= 0 ? '-' : '+'}${Math.abs(lost).toFixed(1)}</b><span>depuis ${st.startWeight}</span></div>
    <div class="stat"><b>${s.rate === null ? '–' : (s.rate > 0 ? '+' : '') + s.rate.toFixed(2)}</b><span>kg / sem.</span></div>
    <div class="stat"><b>${s.needed.toFixed(2)}</b><span>requis / sem.</span></div></div>
    <p style="margin:10px 0 0">${s.rate === null ? '<span class="muted">Il faut environ une semaine de pesées pour estimer ton rythme.</span>'
      : onTrack ? `✅ Dans les clous. Objectif ${st.goalWeight} kg vers le <b>${fmt(s.eta)}</b>.`
      : `<span class="warn">⚠️ En retard sur l'objectif du ${fmt(st.goalDate)}.</span> ${s.eta ? 'À ce rythme : ' + fmt(s.eta) + '.' : 'Le poids ne baisse pas encore.'}`}</p></div>
  <div class="card">${chart(s.avg)}</div>
  ${viewMesures()}
  ${S.weights.length ? `<div class="card"><h2>Pesées</h2>${[...S.weights].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10).map(w =>
    `<div class="item"><span>${fmt(w.date)}</span><span class="row" style="flex:none"><b>${w.kg}</b><button class="x" data-a="delKg" data-v="${w.date}">×</button></span></div>`).join('')}</div>` : ''}`;
}

const MES = [['ventre', 'Ventre'], ['taille', 'Taille'], ['poitrine', 'Poitrine'], ['bras', 'Bras']];
function viewMesures() {
  const m = S.measures, first = m[0], last = m[m.length - 1];
  return `<div class="card"><h2>Mensurations (cm)</h2>
    <div class="grid4">${MES.map(([k, l]) => `<div class="stat"><b>${last?.[k] ?? '–'}</b><span>${l}${first?.[k] && last?.[k] && last !== first ? ' ' + (last[k] - first[k] > 0 ? '+' : '') + (last[k] - first[k]).toFixed(1) : ''}</span></div>`).join('')}</div>
    <div class="row" style="margin-top:10px">${MES.map(([k, l]) => `<input id="m_${k}" inputmode="decimal" placeholder="${l}">`).join('')}</div>
    <button class="ghost" data-a="addMes" style="width:100%;margin-top:8px">Ajouter (1x/semaine, le matin)</button>
    <p class="muted" style="margin-bottom:0">Ventre : au niveau du nombril. Taille : point le plus étroit. Laisse vide ce que tu ne mesures pas.</p></div>`;
}

function viewCheville() {
  const a = S.ankle, done = a.log[today()] || [], ph = REHAB[a.phase], ok = CRITERIA.every((_, i) => a.criteria[i]);
  return `<h1>Cheville et course</h1>
  <div class="card"><div class="seg">${[1, 2, 3].map(p => `<button class="${p === a.phase ? 'on' : ''}" data-a="phase" data-v="${p}">Phase ${p}</button>`).join('')}</div>
    <h2 style="margin-top:12px">${ph.name}</h2>
    ${ph.items.map((t, i) => `<label class="check"><input type="checkbox" data-a="rehab" data-v="${i}" ${done.includes(i) ? 'checked' : ''}><span>${t}</span></label>`).join('')}
    <p class="muted">Passe à la phase suivante quand tout se fait sans douleur. Continue la phase 3 au moins 3 fois par semaine pendant 3 mois, même guéri : c'est ce qui empêche les rechutes. Douleur forte, gros gonflement ou appui impossible : consulte.</p></div>
  <div class="card"><h2>Critères avant de courir</h2>
    ${CRITERIA.map((c, i) => `<label class="check"><input type="checkbox" data-a="crit" data-v="${i}" ${a.criteria[i] ? 'checked' : ''}><span>${c}</span></label>`).join('')}
    <p class="${ok ? '' : 'warn'}" style="margin-bottom:0">${ok ? '✅ Feu vert pour la reprise progressive.' : 'Pas de course ni de corde à sauter tant que tout n\'est pas coché.'}</p></div>
  <div class="card"><h2>Plan de reprise course</h2>${RUNPLAN.map(r => `<div class="item"><span>${r}</span></div>`).join('')}
    ${!ok ? '<details><summary>Pourquoi pas 30, 35, 40 min ?</summary><p class="muted">+5 min par semaine fait environ +15 %, trop rapide après une entorse récidivante. +10 % et une semaine allégée régulière te mènent à 10 km sans rechute.</p></details>' : ''}</div>
  ${ok ? `<div class="card"><h2>Ajouter une sortie</h2><div class="row"><input id="rKm" inputmode="decimal" placeholder="km"><input id="rMin" inputmode="numeric" placeholder="min"><input id="rPain" inputmode="numeric" placeholder="douleur 0-10"></div>
    <button data-a="addRun" style="width:100%;margin-top:8px">Enregistrer</button>
    ${S.runs.slice(-6).reverse().map(r => `<div class="item"><span>${fmt(r.date)} · ${r.km} km en ${r.min} min <span class="muted">${r.km ? (r.min / r.km).toFixed(1) + ' min/km' : ''}</span></span><span class="${r.pain >= 3 ? 'bad' : 'muted'}">douleur ${r.pain}</span></div>`).join('')}
    <p class="muted">Douleur ≥ 3 pendant ou le lendemain : reviens à l'étape précédente.</p></div>` : ''}`;
}

function viewReglages() {
  const st = S.settings, f = (k, l, t = 'number') => `<label class="muted">${l}<input data-a="setting" data-v="${k}" type="${t}" value="${esc(st[k])}" style="margin:4px 0 10px"></label>`;
  return `<h1>Réglages</h1>
  <div class="card"><h2>IA</h2>${f('apiKey', 'Clé API OpenAI (reste sur ce téléphone)', 'password')}${f('model', 'Modèle', 'text')}</div>
  <div class="card"><h2>Mon profil (pour le coach IA)</h2><textarea data-a="setting" data-v="profil" placeholder="Âge, poids, blessures, matériel, niveau, objectifs, contraintes…">${esc(st.profil)}</textarea><p class="muted" style="margin-bottom:0">Reste sur ce téléphone, comme toutes tes données.</p></div>
  <div class="card"><h2>Objectifs</h2>${f('kcal', 'Calories par jour')}${f('prot', 'Protéines par jour (g)')}${f('startWeight', 'Poids de départ (kg)')}${f('goalWeight', 'Poids objectif (kg)')}${f('goalDate', 'Date objectif', 'date')}
    <p class="muted">Calories et protéines : point de départ à ajuster. Si la moyenne 7 jours ne baisse pas en 2 semaines, retire 150 kcal.</p></div>
  <div class="card"><h2>Sauvegarde</h2><p class="muted">Les données sont sur ce téléphone uniquement. Exporte de temps en temps.</p>
    <div class="row"><button class="ghost" data-a="export">Exporter</button><button class="ghost" data-a="import">Importer</button></div>
    <input type="file" id="importFile" accept=".json" hidden></div>`;
}

const TABS = [['repas', '🍽', 'Repas'], ['seance', '💪', 'Séance'], ['poids', '⚖️', 'Poids'], ['cheville', '🦶', 'Cheville'], ['reglages', '⚙️', 'Réglages']];
const VIEWS = {repas: viewRepas, seance: viewSeance, poids: viewPoids, cheville: viewCheville, reglages: viewReglages};
function render() {
  document.getElementById('app').innerHTML = VIEWS[tab]();
  document.getElementById('nav').innerHTML = TABS.map(([k, i, l]) => `<button class="${k === tab ? 'on' : ''}" data-a="tab" data-v="${k}"><b>${i}</b>${l}</button>`).join('');
}

// ---------- Actions ----------
const A = {
  tab: v => { tab = v; aiOut = ''; scrollTo(0, 0); },
  day: v => { mealDate = addDays(mealDate, +v); aiOut = ''; },
  async meal() {
    const txt = mealTxt = document.getElementById('mealText').value.trim(); if (!txt) return;
    busy = true; aiOut = ''; render();
    try {
      const r = JSON.parse(await ask(MEAL_PROMPT, txt, true));
      (S.meals[mealDate] ||= []).push(...r.items.map(i => ({...i, id: uid()}))); save();
      aiOut = [r.hypotheses && 'Hypothèses : ' + r.hypotheses, r.question && '❓ ' + r.question].filter(Boolean).join('\n\n');
      mealTxt = '';
    } catch (e) { aiOut = '⚠️ ' + e.message; }
    busy = false;
  },
  delItem: v => { S.meals[mealDate] = S.meals[mealDate].filter(i => i.id !== v); save(); },
  sess: v => { sessionKey = v; mode = PROGRAM[v].def; },
  gtgAdd: v => { (S.gtg.log[today()] ||= []).push(+v); save(); },
  gtgUndo: () => { S.gtg.log[today()]?.pop(); save(); },
  gtgMax() {
    const n = parseInt(document.getElementById('maxIn').value); if (!n && n !== 0) return;
    S.gtg.tests = S.gtg.tests.filter(t => t.date !== today()).concat({date: today(), max: n}); save();
  },
  addCardio() {
    const min = parseInt(document.getElementById('cMin').value); if (!min) return;
    S.cardio.push({id: uid(), date: today(), type: document.getElementById('cType').value, min}); save();
  },
  addMes() {
    const e = {date: today()};
    MES.forEach(([k]) => { const v = parseFloat(document.getElementById('m_' + k).value.replace(',', '.')); if (v) e[k] = v; });
    if (Object.keys(e).length === 1) return;
    S.measures = S.measures.filter(m => m.date !== today()).concat(e); save();
  },
  mode: v => { mode = v; },
  saveW() {
    if (!draft.exercises.some(e => e.sets.some(s => s.reps))) return alert('Aucune série remplie.');
    S.workouts.push({id: uid(), date: today(), session: draft.session, mode: draft.mode, note: document.getElementById('wNote').value,
      exercises: draft.exercises.map(e => ({name: e.name, sets: e.sets.filter(s => s.reps)}))});
    save(); draft = null; sessionKey = null; mode = PROGRAM[nextSession()].def; alert('Séance enregistrée 💪');
  },
  delW: v => { if (confirm('Supprimer cette séance ?')) { S.workouts = S.workouts.filter(w => w.id !== v); save(); } },
  async coach() {
    const q = document.getElementById('coachQ').value.trim(); if (!q) return;
    busy = true; aiOut = ''; render();
    try { aiOut = await ask(COACH_PROMPT, 'Contexte : ' + context() + '\n\nQuestion : ' + q); } catch (e) { aiOut = '⚠️ ' + e.message; }
    busy = false;
  },
  addKg() {
    const kg = parseFloat(document.getElementById('wKg').value.replace(',', '.')); if (!kg) return;
    S.weights = S.weights.filter(w => w.date !== today()).concat({date: today(), kg}); save();
  },
  delKg: v => { S.weights = S.weights.filter(w => w.date !== v); save(); },
  phase: v => { S.ankle.phase = +v; save(); },
  addRun() {
    const g = id => parseFloat(document.getElementById(id).value.replace(',', '.')) || 0;
    S.runs.push({date: today(), km: g('rKm'), min: g('rMin'), pain: g('rPain')}); save();
  },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({...S, settings: {...S.settings, apiKey: ''}}, null, 1)], {type: 'application/json'}));
    a.download = 'suivi-forme-' + today() + '.json'; a.click();
  },
  import() { document.getElementById('importFile').click(); }
};

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b || !A[b.dataset.a]) return;
  await A[b.dataset.a](b.dataset.v); render();
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.a, v = t.dataset.v;
  if (a === 'swap') { draft.exercises[+v].name = t.value; render(); }  else if (a === 'setting') { S.settings[v] = t.type === 'number' ? +t.value : t.value.trim(); save(); }
  else if (a === 'rehab') { const d = S.ankle.log[today()] ||= []; t.checked ? d.push(+v) : d.splice(d.indexOf(+v), 1); save(); }
  else if (a === 'crit') { S.ankle.criteria[v] = t.checked; save(); render(); }
  else if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then(txt => { const key = S.settings.apiKey; S = Object.assign(structuredClone(DEFAULT), JSON.parse(txt)); S.settings.apiKey ||= key; save(); render(); alert('Import terminé.'); })
      .catch(() => alert('Fichier invalide.'));
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (t.dataset.a !== 'set') return;
  const [i, j, f] = t.dataset.v.split(','); draft.exercises[+i].sets[+j][f] = t.value.replace(',', '.');
});
mode = PROGRAM[nextSession()].def;
render();
</script>
</body>
</html>

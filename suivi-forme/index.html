<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forme">
<meta name="theme-color" content="#0f1115">
<title>Suivi Forme</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--text:#eef0f4;--muted:#8b93a3;--accent:#4ade80;--accent2:#60a5fa;--warn:#fbbf24;--bad:#f87171;--line:#2a2f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
textarea,input,select{width:100%;min-width:0;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:84px;resize:vertical}
button{background:var(--accent);color:#06210f;border:0;border-radius:10px;padding:11px 14px;font:600 15px inherit;font-family:inherit;cursor:pointer}
button.ghost{background:var(--card2);color:var(--text)}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.x{background:none;color:var(--muted);padding:0 4px;font-size:18px}
.tag{display:inline-block;background:var(--card2);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);margin-right:4px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--muted);padding:8px}
.seg button.on{background:var(--card);color:var(--text)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;margin-top:8px}
.sets input{padding:7px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
nav{position:fixed;bottom:0;left:0;right:0;background:#12151bee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 0 12px;font-size:11px;font-weight:500}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent)}
.ai{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:12px;margin-top:10px}
.warn{color:var(--warn)}
.bad{color:var(--bad)}
svg text{fill:var(--muted);font-size:10px}
.guide{background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:14px}
.guide p{margin:4px 0 8px}
.vid{display:inline-block;color:var(--accent2);text-decoration:none;font-weight:600;font-size:14px}
.bloc{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:14px}
.ex.inbloc{border-left:3px solid var(--accent);padding-left:10px;border-top:0}
details summary{cursor:pointer;color:var(--accent2);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
// ---------- Données de base ----------
const ex = (n, t, alt, b) => ({n, t, alt, b});
// b : bloc. Les exercices d'un même bloc s'enchaînent sans repos, repos 90 s à la fin du bloc.

      ex('Y-T-W au sol', '3 x 10', ['Face pull élastique'], TRI),
      ex('Finisher EMOM 8 min', '8 min : minutes impaires 10 pompes, paires 8 rowings australiens', ['Finisher circuit 3 tours'], FIN)],

      ex('Dips', '4 x 8-12', ['Dips lestés'], SS1),
      ex('Rowing barre', '4 x 8-10', ['Rowing haltère un bras'], SS2),
      ex('Développé incliné haltères', '4 x 8-12', ['Développé haltères'], SS2),
      ex('Tirage vertical poulie', '3 x 10-12', ['Tirage prise serrée'], SS3),
      ex('Développé militaire haltères', '3 x 8-10', ['Arnold press'], SS3),

    salle: [ex('Presse à cuisses', '4 x 10-12', ['Presse pieds bas']),
      ex('Hack squat', '3 x 10-12', ['Goblet squat (si cheville OK)', 'Presse à cuisses']),
      ex('Leg extension', '3 x 12-15', ['Sissy squat assisté']),
      ex('Split squat statique', '3 x 8 / jambe (si zéro douleur)', ['Presse unilatérale']),
      ex('Mollets debout (rééducation)', '4 x 12-15', ['Mollets à la presse']),
      ex('Relevés de jambes suspendu', '3 x 10-12', ['Relevés de genoux', 'Crunch poulie']),
      ex('Tractions assistées machine', '3 x 8-10', ['Tirage vertical poulie'], BONUS),
      ex('Finisher vélo ou rameur', '10 min : 30 s fort / 30 s léger', ['Vélo ou rameur Zone 2'], FIN)],
    maison: [ex('Chaise murale', '4 x 45-60 s', ['Squat partiel sans douleur']),
      ex('Split squat statique', '4 x 10 / jambe', ['Fente arrière lente (si zéro douleur)']),
      ex('Pont fessier une jambe', '3 x 12-15', ['Pont fessier deux jambes']),
      ex('Montées sur pointe', '4 x 15', ['Montées sur pointe assis']),
      ex('Relevés de genoux à la barre', '3 x 10-12', ['Hollow hold']),
      ex('Tractions négatives', '3 x 3', ['Suspension active 20 s'], BONUS),
      ex('HIIT sans saut', '8 x (30 s effort / 30 s repos)', ['Marche rapide Zone 2'], FIN)]},
  H2: {name: 'Haut du corps 2, volume', def: 'maison',
    note: 'Plus de répétitions, moins de repos (60 s après chaque bloc). Garde 1-2 reps en réserve sauf sur la dernière série.',
    maison: [ex('Rowing australien pieds surélevés', '4 x 6-10', ['Rowing australien (barre basse)'], SS1),

      ex('Tractions négatives prise serrée', '4 x 3 (descente 5 s)', ['Tractions négatives'], SS2),
      ex('Dips', '4 x max -2', ['Dips négatifs'], SS2),
      ex('Face pull élastique', '3 x 15-20', ['Y-T-W au sol'], SS3),

const WEEK = [['Lun', 'H1 · Haut du corps force (maison)'], ['Mar', 'J1 · Jambes quadriceps (salle)'], ['Mer', 'H2 · Haut du corps volume (maison)'],
  ['Jeu', 'J2 · Jambes fessiers et ischios (salle)'], ['Ven', 'Repos, marche, 10 000 pas'], ['Sam', 'H3 · Densité + HIIT (maison)'], ['Dim', 'Repos ou Zone 2']];
const ORDER = ['H1', 'J1', 'H2', 'J2', 'H3'];

// ---------- Fiches exercices (d : départ, m : mouvement, k : points clés, e : erreur, q : recherche vidéo) ----------

const GUIDE = {

  'Finisher circuit 3 tours': G('Barre basse prête.', '10 pompes, 10 rowings australiens, 30 s de planche, sans pause. 60 s de repos, 3 tours.', 'Note ton temps total.', 'Bâcler la technique.', 'bodyweight finisher circuit'),
  'Finisher vélo ou rameur': G('Vélo ou rameur, 2 min d\'échauffement léger.', '30 s à fond, 30 s très léger, pendant 8 à 10 min.', 'Sans impact pour la cheville. Tu dois finir essoufflé.', 'Faire tout à vitesse moyenne.', 'bike sprint intervals'),
  'Hack squat': G('Dos et épaules contre les coussins, pieds largeur d\'épaules au milieu de la plateforme.', 'Descends jusqu\'à cuisses parallèles, pousse.', 'Pieds fixes : plus sûr pour la cheville qu\'un squat libre.', 'Genoux qui rentrent.', 'hack squat form'),
  'Soulevé de terre roumain haltères': G('Debout, haltères devant les cuisses, genoux légèrement pliés.', 'Pousse les fesses vers l\'arrière en gardant le dos plat, descends jusqu\'à mi-tibia, remonte en serrant les fesses.', 'Les haltères frôlent les jambes. Tu dois sentir l\'arrière des cuisses s\'étirer.', 'Arrondir le dos.', 'dumbbell romanian deadlift form'),
  'Presse pieds hauts': G('Presse à cuisses, pieds en haut de la plateforme.', 'Descends profond, pousse dans les talons.', 'Cible plus les fessiers et les ischios.', 'Bas du dos qui décolle.', 'leg press high foot placement glutes'),
  'Abducteurs machine': G('Assis, genoux contre les coussins.', 'Écarte les jambes, 1 s ouvert, reviens lentement.', 'Buste légèrement penché en avant pour mieux cibler les fessiers.', 'Laisser claquer les poids.', 'hip abduction machine form'),
  'Mollets assis machine': G('Assis, genoux sous le coussin, avant des pieds sur la marche.', 'Monte haut, redescends lentement sous la marche.', 'Renforce aussi la cheville.', 'Rebondir.', 'seated calf raise form'),
  'Tractions négatives': G('Monte au-dessus de la barre avec une chaise ou un saut, menton au-dessus de la barre.', 'Descends le plus lentement possible (5 s) jusqu\'aux bras tendus. Remonte avec la chaise, recommence.', 'Omoplates serrées et basses, gainage, contrôle jusqu\'en bas.', 'Se laisser tomber à la fin. Les 2 dernières secondes comptent le plus.', 'negative pull ups tutorial'),
  'Tractions strictes (quand max ≥ 5)': G('Suspendu, bras tendus, mains un peu plus larges que les épaules, paumes vers l\'avant.', 'Tire les coudes vers les hanches jusqu\'au menton au-dessus de la barre, redescends contrôlé.', 'Commence par abaisser les épaules, pas d\'élan, gainage.', 'Balancer les jambes ou ne descendre qu\'à moitié.', 'pull up proper form'),

  'Dips lestés sac à dos (quand 4 x 12 OK)': G('Sac à dos chargé (livres, bouteilles), sur les épaules.', 'Dips normaux.', 'Ajoute 2-5 kg à la fois.', 'Ajouter du poids avant de maîtriser 4 x 12 propres.', 'weighted dips backpack'),

  'Relevés de genoux à la barre': G('Suspendu à la barre, bras tendus.', 'Monte les genoux vers la poitrine en enroulant le bassin, redescends lentement.', 'Pas d\'élan, expire en montant.', 'Se balancer.', 'hanging knee raise'),

const AC = '#4ade80', MU = '#8b93a3', TX = '#eef0f4';
const svg = (inner, h = 120) => `<svg viewBox="0 0 220 ${h}" width="100%" style="max-width:340px;display:block;margin:6px 0" fill="none" stroke="${TX}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${AC}" stroke="none"/></marker></defs>${inner}</svg>`;
const arrow = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${AC}" marker-end="url(#ar)"/>`;
const curve = d => `<path d="${d}" stroke="${AC}" marker-end="url(#ar)"/>`;
const label = (x, y, t, a = 'middle') => `<text x="${x}" y="${y}" text-anchor="${a}" fill="${MU}" stroke="none" font-size="10">${t}</text>`;

// Jambe et pied vus de côté : x = cheville, y = sol. lift = talon levé (pointe), toeUp = pointe levée (talon)
function foot(x, y, {lift = 0, toeUp = 0, ghost = false} = {}) {
  const c = ghost ? `stroke="${MU}" stroke-dasharray="3 3"` : '';
  const ay = y - 12 - lift, toeX = x + 38, toeY = y - toeUp;
  return `<g ${c}><line x1="${x}" y1="${ay - 55}" x2="${x}" y2="${ay}"/><path d="M${x - 9} ${ay + 6 + (lift ? 0 : 6)} Q${x - 10} ${ay - 2} ${x} ${ay} L${toeX} ${toeY - 4} L${toeX} ${toeY} L${x - 9} ${lift ? y - lift + 4 : y}"/></g>`;
}
// Bonhomme debout : x, y = sol
function fig(x, y, {one = false, arms = 'down', eyes = 'open', toes = false, wall = false} = {}) {
  const hy = y - 58, foot = toes ? y - 6 : y;
  let s = `<circle cx="${x}" cy="${y - 100}" r="8"/><line x1="${x}" y1="${y - 92}" x2="${x}" y2="${hy}"/>`;
  s += arms === 'out' ? `<line x1="${x - 28}" y1="${y - 80}" x2="${x + 28}" y2="${y - 80}"/>` : arms === 'wall' ? `<line x1="${x}" y1="${y - 82}" x2="${x + 24}" y2="${y - 78}"/>` : `<line x1="${x}" y1="${y - 84}" x2="${x - 12}" y2="${y - 62}"/><line x1="${x}" y1="${y - 84}" x2="${x + 12}" y2="${y - 62}"/>`;
  s += `<line x1="${x}" y1="${hy}" x2="${x - 2}" y2="${foot}"/><line x1="${x - 4}" y1="${foot}" x2="${x + 8}" y2="${foot}"/>`;
  s += one ? `<polyline points="${x},${hy} ${x + 14},${hy + 18} ${x + 6},${hy + 34}"/>` : `<line x1="${x}" y1="${hy}" x2="${x + 6}" y2="${foot}"/>`;
  if (eyes === 'closed') s += `<line x1="${x + 1}" y1="${y - 101}" x2="${x + 6}" y2="${y - 101}" stroke-width="1.5"/>`;
  if (wall) s += `<line x1="${x + 26}" y1="${y - 115}" x2="${x + 26}" y2="${y}" stroke="${MU}" stroke-width="4"/>`;
  return s;
}

// ---------- IA (OpenAI) ----------
async function ask(system, user, json) {
  if (!S.settings.apiKey) throw new Error('Ajoute ta clé OpenAI dans Réglages.');
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + S.settings.apiKey},
    body: JSON.stringify({model: S.settings.model, messages: [{role: 'system', content: system}, {role: 'user', content: user}],
      ...(json ? {response_format: {type: 'json_object'}} : {})})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || 'Erreur API ' + r.status);
  return d.choices[0].message.content;
}

"question" : une seule question courte si une info change beaucoup le total, sinon null. Valeurs en nombres entiers.`;

const COACH_PROMPT = `Tu es le coach sportif et nutrition personnel de l'utilisateur. Réponds en français, direct, concis, concret. N'utilise jamais de tirets longs.
Tu connais son contexte (JSON fourni). Sois prudent avec la cheville : pas de course ni de sauts tant que les critères de reprise ne sont pas validés.
Tu peux proposer des séances, des alternatives d'exercices, ajuster le programme, analyser sa progression et ses calories. Tu n'es pas médecin : renvoie vers un professionnel en cas de douleur forte, gonflement important ou rechute.`;

// ---------- Calculs ----------
function dayTotals(d) {
  const t = {kcal: 0, p: 0, g: 0, l: 0};
  (S.meals[d] || []).forEach(i => { t.kcal += +i.kcal || 0; t.p += +i.proteines || 0; t.g += +i.glucides || 0; t.l += +i.lipides || 0; });
  return t;
}
function weightStats() {
  const w = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const avg = w.map((x, i) => {
    const win = w.filter(y => y.date <= x.date && y.date > addDays(x.date, -7));
    return {date: x.date, kg: x.kg, avg: win.reduce((s, y) => s + y.kg, 0) / win.length};
  });
  let rate = null, eta = null;
  if (avg.length >= 2) {
    const last = avg[avg.length - 1], ref = avg.find(a => a.date >= addDays(last.date, -14)) || avg[0];
    const days = (new Date(last.date) - new Date(ref.date)) / 864e5;
    if (days >= 5) {
      rate = (last.avg - ref.avg) / days * 7;
      if (rate < 0) eta = addDays(last.date, Math.round((last.avg - S.settings.goalWeight) / -rate * 7));
    }
  }
  const cur = avg.length ? avg[avg.length - 1].avg : S.settings.startWeight;
  const weeksLeft = Math.max(0.1, (new Date(S.settings.goalDate) - new Date(today())) / 6048e5);
  return {avg, rate, eta, cur, needed: (S.settings.goalWeight - cur) / weeksLeft};
}
function lastPerf(name) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const e = S.workouts[i].exercises.find(x => x.name === name && x.sets.some(s => s.reps));
    if (e) return fmt(S.workouts[i].date) + ' : ' + e.sets.filter(s => s.reps).map(s => s.reps + (s.kg ? '×' + s.kg + 'kg' : '')).join(', ');
  }
  return null;
}
const nextSession = () => { const l = S.workouts[S.workouts.length - 1]; return l ? ORDER[(ORDER.indexOf(l.session) + 1) % ORDER.length] : ORDER[0]; };
const pullMax = () => S.gtg.tests[S.gtg.tests.length - 1]?.max || 1;
const gtgReps = () => Math.max(1, Math.floor(pullMax() / 2));
const weekStart = () => { const d = new Date(today() + 'T12:00'); return addDays(today(), -((d.getDay() + 6) % 7)); };

function chart(avg) {
  if (avg.length < 2) return '<p class="muted">La courbe apparaît après 2 pesées.</p>';
  const W = 340, H = 170, pad = 26, g = S.settings.goalWeight;
  const xs = avg.map(a => new Date(a.date).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = avg.flatMap(a => [a.kg, a.avg]).concat(g), y0 = Math.min(...ys) - 0.5, y1 = Math.max(...ys) + 0.5;
  const X = t => pad + (t - x0) / Math.max(1, x1 - x0) * (W - pad - 8), Y = v => 8 + (y1 - v) / (y1 - y0) * (H - 30);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${pad}" x2="${W - 8}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${W - 8}" y="${Y(g) - 4}" text-anchor="end">objectif ${g}</text>
    <text x="2" y="${Y(y1 - 0.5) + 4}">${(y1 - 0.5).toFixed(1)}</text><text x="2" y="${Y(y0 + 0.5) + 4}">${(y0 + 0.5).toFixed(1)}</text>
    ${avg.map((a, i) => `<circle cx="${X(xs[i])}" cy="${Y(a.kg)}" r="2.5" fill="var(--muted)"/>`).join('')}
    <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" points="${avg.map((a, i) => X(xs[i]) + ',' + Y(a.avg)).join(' ')}"/>
    <text x="${pad}" y="${H - 4}">${fmt(avg[0].date)}</text><text x="${W - 8}" y="${H - 4}" text-anchor="end">${fmt(avg[avg.length - 1].date)}</text>
  </svg><p class="muted">Points : pesées. Ligne bleue : moyenne sur 7 jours (la seule à regarder).</p>`;
}

  <div class="card"><h2>Mon profil (pour le coach IA)</h2><textarea data-a="setting" data-v="profil" placeholder="Âge, poids, blessures, matériel, niveau, objectifs, contraintes…">${esc(st.profil)}</textarea><p class="muted" style="margin-bottom:0">Reste sur ce téléphone, comme toutes tes données.</p></div>
  <div class="card"><h2>Objectifs</h2>${f('kcal', 'Calories par jour')}${f('steps', 'Objectif de pas par jour')}${f('prot', 'Protéines par jour (g)')}${f('startWeight', 'Poids de départ (kg)')}${f('goalWeight', 'Poids objectif (kg)')}${f('goalDate', 'Date objectif', 'date')}
    <p class="muted">Calories et protéines : point de départ à ajuster. Si la moyenne 7 jours ne baisse pas en 2 semaines, retire 150 kcal.</p></div>
  <div class="card"><h2>Sauvegarde</h2><p class="muted">Les données sont sur ce téléphone uniquement. Exporte de temps en temps.</p>
    <div class="row"><button class="ghost" data-a="export">Exporter</button><button class="ghost" data-a="import">Importer</button></div>
    <input type="file" id="importFile" accept=".json" hidden></div>`;
}

const TABS = [['repas', '🍽', 'Repas'], ['seance', '💪', 'Séance'], ['poids', '⚖️', 'Poids'], ['cheville', '🦶', 'Cheville'], ['reglages', '⚙️', 'Réglages']];
const VIEWS = {repas: viewRepas, seance: viewSeance, poids: viewPoids, cheville: viewCheville, reglages: viewReglages};
function render() {
  document.getElementById('app').innerHTML = VIEWS[tab]();
  document.getElementById('nav').innerHTML = TABS.map(([k, i, l]) => `<button class="${k === tab ? 'on' : ''}" data-a="tab" data-v="${k}"><b>${i}</b>${l}</button>`).join('');
}

// ---------- Actions ----------
const A = {
  tab: v => { tab = v; aiOut = ''; scrollTo(0, 0); },
  day: v => { mealDate = addDays(mealDate, +v); aiOut = ''; },
  async meal() {
    const txt = mealTxt = document.getElementById('mealText').value.trim(); if (!txt) return;
    busy = true; aiOut = ''; render();
    try {
      const r = JSON.parse(await ask(MEAL_PROMPT, txt, true));
      (S.meals[mealDate] ||= []).push(...r.items.map(i => ({...i, id: uid()}))); save();
      aiOut = [r.hypotheses && 'Hypothèses : ' + r.hypotheses, r.question && '❓ ' + r.question].filter(Boolean).join('\n\n');
      mealTxt = '';
    } catch (e) { aiOut = '⚠️ ' + e.message; }
    busy = false;
  },
  delItem: v => { S.meals[mealDate] = S.meals[mealDate].filter(i => i.id !== v); save(); },
  sess: v => { sessionKey = v; mode = PROGRAM[v].def; },
  gtgAdd: v => { (S.gtg.log[today()] ||= []).push(+v); save(); },
  gtgUndo: () => { S.gtg.log[today()]?.pop(); save(); },
  gtgMax() {
    const n = parseInt(document.getElementById('maxIn').value); if (!n && n !== 0) return;
    S.gtg.tests = S.gtg.tests.filter(t => t.date !== today()).concat({date: today(), max: n}); save();
  },
  addSteps() { const n = parseInt(document.getElementById('stepsIn').value.replace(/\D/g, '')); if (n >= 0) { S.steps[today()] = n; save(); } },
  addCardio() {
    const min = parseInt(document.getElementById('cMin').value); if (!min) return;
    S.cardio.push({id: uid(), date: today(), type: document.getElementById('cType').value, min}); save();
  },
  addMes() {
    const e = {date: today()};
    MES.forEach(([k]) => { const v = parseFloat(document.getElementById('m_' + k).value.replace(',', '.')); if (v) e[k] = v; });
    if (Object.keys(e).length === 1) return;
    S.measures = S.measures.filter(m => m.date !== today()).concat(e); save();
  },
  mode: v => { mode = v; },
  saveW() {
    if (!draft.exercises.some(e => e.sets.some(s => s.reps))) return alert('Aucune série remplie.');
    S.workouts.push({id: uid(), date: today(), session: draft.session, mode: draft.mode, note: document.getElementById('wNote').value,
      exercises: draft.exercises.map(e => ({name: e.name, sets: e.sets.filter(s => s.reps)}))});
    save(); draft = null; sessionKey = null; mode = PROGRAM[nextSession()].def; alert('Séance enregistrée 💪');
  },
  delW: v => { if (confirm('Supprimer cette séance ?')) { S.workouts = S.workouts.filter(w => w.id !== v); save(); } },
  async coach() {
    const q = document.getElementById('coachQ').value.trim(); if (!q) return;
    busy = true; aiOut = ''; render();
    try { aiOut = await ask(COACH_PROMPT, 'Contexte : ' + context() + '\n\nQuestion : ' + q); } catch (e) { aiOut = '⚠️ ' + e.message; }
    busy = false;
  },
  addKg() {
    const kg = parseFloat(document.getElementById('wKg').value.replace(',', '.')); if (!kg) return;
    S.weights = S.weights.filter(w => w.date !== today()).concat({date: today(), kg}); save();
  },
  delKg: v => { S.weights = S.weights.filter(w => w.date !== v); save(); },
  phase: v => { S.ankle.phase = +v; save(); },
  addRun() {
    const g = id => parseFloat(document.getElementById(id).value.replace(',', '.')) || 0;
    S.runs.push({date: today(), km: g('rKm'), min: g('rMin'), pain: g('rPain')}); save();
  },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({...S, settings: {...S.settings, apiKey: ''}}, null, 1)], {type: 'application/json'}));
    a.download = 'suivi-forme-' + today() + '.json'; a.click();
  },
  import() { document.getElementById('importFile').click(); }
};

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b || !A[b.dataset.a]) return;
  await A[b.dataset.a](b.dataset.v); render();
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.a, v = t.dataset.v;
  if (a === 'swap') { draft.exercises[+v].name = t.value; render(); }  else if (a === 'setting') { S.settings[v] = t.type === 'number' ? +t.value : t.value.trim(); save(); }
  else if (a === 'rehab') { const d = S.ankle.log[today()] ||= []; t.checked ? d.push(+v) : d.splice(d.indexOf(+v), 1); save(); }
  else if (a === 'crit') { S.ankle.criteria[v] = t.checked; save(); render(); }
  else if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then(txt => { const key = S.settings.apiKey; S = Object.assign(structuredClone(DEFAULT), JSON.parse(txt)); S.settings.apiKey ||= key; save(); render(); alert('Import terminé.'); })
      .catch(() => alert('Fichier invalide.'));
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (t.dataset.a !== 'set') return;
  const [i, j, f] = t.dataset.v.split(','); draft.exercises[+i].sets[+j][f] = t.value.replace(',', '.');
});
mode = PROGRAM[nextSession()].def;
render();
</script>
</body>
</html>
